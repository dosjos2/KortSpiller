<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
<title>Kortspiller - oversikt</title>
<rect width="100%" height="100%" fill="#fff"/>
<text x="600" y="34" font-size="20" fill="#222" text-anchor="middle" font-weight="700">Kortspiller – slik henger delene sammen</text>
<rect x="30" y="90" width="250" height="130" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="155" y="116" font-size="15" fill="#222" text-anchor="middle" font-weight="700">1. Mapper (PC / Pi m. skjerm)</text>
<text x="155" y="138" font-size="12" fill="#444" text-anchor="middle" >Skann kort → lim inn Spotify-lenke</text>
<text x="155" y="155" font-size="12" fill="#444" text-anchor="middle" >Lagrer mappings.json</text>
<text x="155" y="172" font-size="12" fill="#444" text-anchor="middle" >Publiser (HTTP PUT) / last ned</text>
<rect x="380" y="90" width="240" height="130" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="500" y="116" font-size="15" fill="#222" text-anchor="middle" font-weight="700">2. mappings.json</text>
<text x="500" y="138" font-size="12" fill="#444" text-anchor="middle" >Kort-ID → spotify:track:…</text>
<text x="500" y="155" font-size="12" fill="#444" text-anchor="middle" >ligger på nettserver,</text>
<text x="500" y="172" font-size="12" fill="#444" text-anchor="middle" >Azure Blob, gist eller scp</text>
<rect x="720" y="90" width="440" height="130" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="940" y="116" font-size="15" fill="#222" text-anchor="middle" font-weight="700">3. Player (headless Raspberry Pi, autostart)</text>
<text x="940" y="138" font-size="12" fill="#444" text-anchor="middle" >Henter mappings.json (cache hvis offline)</text>
<text x="940" y="155" font-size="12" fill="#444" text-anchor="middle" >Leser RFID · potmeter · pauseknapp · LED</text>
<text x="940" y="172" font-size="12" fill="#444" text-anchor="middle" >Kaller Spotify Web API (PKCE-token)</text>
<defs><marker id="a280155" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<line x1="280" y1="155" x2="380" y2="155" stroke="#333" stroke-width="2.5" marker-end="url(#a280155)"/>
<text x="330" y="147" font-size="12" fill="#333" text-anchor="middle" >PUT</text>
<defs><marker id="a620155" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<line x1="620" y1="155" x2="720" y2="155" stroke="#333" stroke-width="2.5" marker-end="url(#a620155)"/>
<text x="670" y="147" font-size="12" fill="#333" text-anchor="middle" >GET (ETag)</text>
<rect x="720" y="330" width="200" height="110" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
<text x="820" y="356" font-size="15" fill="#222" text-anchor="middle" font-weight="700">RFID-leser(e)</text>
<text x="820" y="378" font-size="12" fill="#444" text-anchor="middle" >RC522 / PN532 / USB</text>
<rect x="950" y="330" width="210" height="110" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
<text x="1055" y="356" font-size="15" fill="#222" text-anchor="middle" font-weight="700">Potmeter · knapp · LED</text>
<text x="1055" y="378" font-size="12" fill="#444" text-anchor="middle" >MCP3008 · GPIO27 · GPIO22</text>
<defs><marker id="a820330" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<line x1="820" y1="330" x2="820" y2="220" stroke="#333" stroke-width="2.5" marker-end="url(#a820330)"/>
<defs><marker id="a1055330" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<line x1="1055" y1="330" x2="1055" y2="220" stroke="#333" stroke-width="2.5" marker-end="url(#a1055330)"/>
<rect x="380" y="330" width="240" height="110" rx="10" fill="#ede7f6" stroke="#4527a0" stroke-width="2"/>
<text x="500" y="356" font-size="15" fill="#222" text-anchor="middle" font-weight="700">4. Spotify Web API</text>
<text x="500" y="378" font-size="12" fill="#444" text-anchor="middle" >play / pause / volum</text>
<text x="500" y="395" font-size="12" fill="#444" text-anchor="middle" >på enhet «Kortspiller»</text>
<defs><marker id="a720200" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<line x1="720" y1="200" x2="620" y2="360" stroke="#333" stroke-width="2.5" marker-end="url(#a720200)"/>
<text x="670" y="272" font-size="12" fill="#333" text-anchor="middle" >HTTPS</text>
<rect x="30" y="330" width="260" height="110" rx="10" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
<text x="160" y="356" font-size="15" fill="#222" text-anchor="middle" font-weight="700">5. raspotify (librespot)</text>
<text x="160" y="378" font-size="12" fill="#444" text-anchor="middle" >Spotify Connect-enhet</text>
<text x="160" y="395" font-size="12" fill="#444" text-anchor="middle" >Krever Spotify Premium</text>
<defs><marker id="a380385" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<line x1="380" y1="385" x2="290" y2="385" stroke="#333" stroke-width="2.5" marker-end="url(#a380385)"/>
<text x="335" y="377" font-size="12" fill="#333" text-anchor="middle" >styrer</text>
<rect x="30" y="470" width="260" height="60" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
<text x="160" y="496" font-size="15" fill="#222" text-anchor="middle" font-weight="700">Høyttaler / DAC</text>
<defs><marker id="a160440" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<line x1="160" y1="440" x2="160" y2="470" stroke="#333" stroke-width="2.5" marker-end="url(#a160440)"/>
<text x="600" y="545" font-size="12" fill="#555" text-anchor="middle" >Samme mappings.json fungerer uansett leser: hex-ID (RC522/PN532) og desimal-ID (USB-leser) regnes som samme kort.</text>
</svg>
